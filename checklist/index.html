<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Check List RUB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --primary:#5B5698;--primary-2:#6f69ac;--primary-dark:#21102f;
  --bg:#f6f4fa;--card:#fff;--text:#211a2b;--muted:#746b80;--border:#e5dfec;
  --shadow:0 4px 20px rgba(32,16,47,.07)
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Inter,Arial,sans-serif;color:var(--text);transition:.25s}
.gic-topbar{min-height:112px;padding:18px 30px;display:flex;align-items:center;background:linear-gradient(100deg,#050307 0%,#16051f 42%,#2a0738 100%);box-shadow:0 8px 28px rgba(32,16,47,.20);position:relative;overflow:hidden}
.gic-topbar:after{content:"";position:absolute;width:330px;height:330px;right:-90px;bottom:-245px;border:1px solid rgba(255,255,255,.14);border-radius:50%}
.gic-logo{width:150px;max-height:76px;object-fit:contain;object-position:left center}
.container{max-width:1380px;margin:0 auto;padding:28px 28px 44px}
.hero{background:linear-gradient(120deg,#21102f,var(--primary));border-radius:18px;padding:25px 28px;color:#fff;box-shadow:0 13px 30px rgba(91,86,152,.23);display:flex;align-items:center;justify-content:space-between;gap:20px}
.hero h1{margin:0;font-size:26px;letter-spacing:.01em}
.theme-toggle{height:42px;padding:0 14px;border:1px solid rgba(255,255,255,.22);border-radius:12px;background:rgba(255,255,255,.10);color:#fff;font:600 13px Inter;cursor:pointer;display:flex;align-items:center;gap:8px}
.theme-toggle:hover{background:rgba(255,255,255,.17)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:20px 0 22px}
.kpi{background:var(--card);border:1px solid var(--border);border-top:4px solid var(--primary);border-radius:16px;padding:20px 22px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow)}
.kpi .name{font-size:13px;color:var(--muted);font-weight:600}
.kpi .number{font-size:28px;color:var(--primary);font-weight:700}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 12px}
.section-title h2{font-size:17px;margin:0}.section-title span{font-size:12px;color:var(--muted)}
.list{display:grid;gap:11px}
.row{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:15px 18px;display:grid;grid-template-columns:115px minmax(150px,1.25fr) 120px minmax(160px,1.25fr) minmax(145px,1.15fr) 105px 110px;gap:14px;align-items:center;min-height:80px;box-shadow:var(--shadow)}
.cell{min-width:0}.label{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:6px;font-weight:600}
.value{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.type{font-weight:650}
.badge{display:inline-flex;align-items:center;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:600;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rub{background:#efedfa;color:#524d90;border:1px solid #d6d2ef}.client{background:#eef6ff;color:#2f6595;border:1px solid #cfe1f3}.plugin{background:#f2f4f7;color:#475467;border:1px solid #e1e5ea}.ticket{background:#edf4ff;color:#315fa4;border:1px solid #cbdcf5}.issue{background:#fff1f1;color:#c83c3c;border:1px solid #f4c7c7}.na{color:#a0a6b5;background:#f5f6f8;border-color:#e6e8ec}
.footer-note{margin-top:15px;color:var(--muted);font-size:11px;text-align:right}

/* Dark mode */
body.dark-mode{--bg:#100d16;--card:#19151f;--text:#f2eff7;--muted:#aaa2b6;--border:#332d3d;--primary:#8179c4;--shadow:0 4px 20px rgba(0,0,0,.24)}
body.dark-mode .hero{background:linear-gradient(120deg,#17091f,#453d7b)}
body.dark-mode .rub{background:#2b2540;color:#d4cff3;border-color:#4b4268}
body.dark-mode .client{background:#17283a;color:#a9cff1;border-color:#294660}
body.dark-mode .plugin{background:#25232a;color:#d0ccd5;border-color:#403b47}
body.dark-mode .ticket{background:#19283d;color:#a9c9f3;border-color:#2c4668}
body.dark-mode .issue{background:#351e25;color:#f3adb8;border-color:#60303b}
body.dark-mode .na{background:#242129;color:#9f99aa;border-color:#39343f}

@media(max-width:1100px){.row{grid-template-columns:repeat(4,1fr)}}
@media(max-width:720px){.gic-topbar{min-height:90px;padding:14px 18px}.gic-logo{width:125px}.container{padding:18px 12px 30px}.hero{align-items:flex-start}.kpis{grid-template-columns:1fr}.row{grid-template-columns:1fr 1fr}}
</style>
</head>

<script>
"use strict";
const themeToggle=document.getElementById("themeToggle"),themeIcon=document.getElementById("themeIcon"),themeText=document.getElementById("themeText");
function aplicarTema(t){const d=t==="dark";document.body.classList.toggle("dark-mode",d);themeIcon.textContent=d?"☀":"☾";themeText.textContent=d?"Modo claro":"Dark mode";localStorage.setItem("checklist-rub-theme",t)}
const temaSalvo=localStorage.getItem("checklist-rub-theme");if(temaSalvo)aplicarTema(temaSalvo);
themeToggle.addEventListener("click",()=>aplicarTema(document.body.classList.contains("dark-mode")?"light":"dark"));

const SHEET_ID="1JlzmXctM6C2N-YybJtbrNM3FDaNfZF-kuzhJ581ilQU";
const GID="992054829";
const REFRESH_MS=30000;
const CSV_URL=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${GID}&range=A5:K`;

function parseCSV(text){const rows=[];let row=[],field="",quoted=false;for(let i=0;i<text.length;i++){const ch=text[i];if(quoted){if(ch==='"'&&text[i+1]==='"'){field+='"';i++}else if(ch==='"')quoted=false;else field+=ch}else{if(ch==='"')quoted=true;else if(ch===','){row.push(field);field=""}else if(ch==="\n"){row.push(field.replace(/\r$/,""));rows.push(row);row=[];field=""}else field+=ch}}if(field.length||row.length){row.push(field.replace(/\r$/,""));rows.push(row)}return rows}
function normalizar(v){return String(v??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\\/g,"").trim().toLowerCase()}
function isValidRef(v){const s=String(v??"").trim().toLowerCase().replace(/\s/g,"");return !["","n/a","n\\a","na","none","nan","-"].includes(s)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function badge(value,cls){const na=!isValidRef(value);return `<span class="badge ${cls} ${na?"na":""}">${esc(value||"n/a")}</span>`}
function converterLinhas(rows){if(!rows.length)return[];const headers=rows[0].map(normalizar);const indexOf=(...nomes)=>headers.findIndex(h=>nomes.map(normalizar).includes(h));const idx={data:indexOf("Data"),tipo:indexOf("Tipo de teste"),rub:indexOf("Versão RUB","Versao RUB"),client:indexOf("Versão client VUE","Versão Client VUE","Versao client VUE"),plugin:indexOf("Plugin"),ticket:indexOf("Ticket"),issue:indexOf("Issue")};const get=(row,i)=>{if(i<0)return"n/a";const value=row[i];return value!=null&&String(value).trim()?String(value).trim():"n/a"};return rows.slice(1).filter(r=>r.some(v=>String(v??"").trim()!=="")).map(r=>({data:get(r,idx.data),tipo:get(r,idx.tipo),rub:get(r,idx.rub),client:get(r,idx.client),plugin:get(r,idx.plugin),ticket:get(r,idx.ticket),issue:get(r,idx.issue)})).filter(r=>[r.data,r.tipo,r.rub,r.client,r.plugin,r.ticket,r.issue].some(isValidRef))}
function render(data,source){const tickets=new Set(data.filter(r=>isValidRef(r.ticket)).map(r=>String(r.ticket).trim()));const issues=new Set(data.filter(r=>isValidRef(r.issue)).map(r=>String(r.issue).trim()));document.getElementById("kpiTests").textContent=data.length;document.getElementById("kpiTickets").textContent=tickets.size;document.getElementById("kpiIssues").textContent=issues.size;document.getElementById("sourceStatus").textContent=source;document.getElementById("list").innerHTML=data.map(r=>`<article class="row"><div class="cell"><span class="label">Data</span><span class="value">${esc(r.data)}</span></div><div class="cell"><span class="label">Tipo de teste</span><span class="value type">${esc(r.tipo)}</span></div><div class="cell"><span class="label">Versão RUB</span>${badge(r.rub,"rub")}</div><div class="cell"><span class="label">Versão Client VUE</span>${badge(r.client,"client")}</div><div class="cell"><span class="label">Plugin</span>${badge(r.plugin,"plugin")}</div><div class="cell"><span class="label">Ticket</span>${badge(r.ticket,"ticket")}</div><div class="cell"><span class="label">Issue</span>${badge(r.issue,"issue")}</div></article>`).join("")}
async function carregarPlanilha(){const status=document.getElementById("sourceStatus");status.textContent="Atualizando...";try{const response=await fetch(CSV_URL+"&_="+Date.now(),{cache:"no-store"});if(!response.ok)throw new Error(`Erro HTTP: ${response.status}`);const csv=await response.text();if(!csv||csv.trim().startsWith("<!DOCTYPE html"))throw new Error("A planilha não retornou CSV.");const data=converterLinhas(parseCSV(csv));if(!data.length)throw new Error("Nenhum registro encontrado.");render(data,"Atualizado: "+new Date().toLocaleTimeString("pt-BR"))}catch(error){console.error("Erro ao carregar planilha:",error);status.textContent="Erro ao carregar dados";document.getElementById("list").innerHTML=`<article class="row" style="grid-template-columns:1fr"><div class="cell"><span class="value">Não foi possível ler a planilha. Confirme que ela está como "Qualquer pessoa com o link - Leitor".</span></div></article>`}}
carregarPlanilha();setInterval(carregarPlanilha,REFRESH_MS);
</script>
